name: SCA Dependency-Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Base NVD pre-construite et publiee chaque nuit par un repo public
  # (construite avec dependency-check-maven 13.0.0, meme version que le pom)
  NVD_MIRROR_URL: https://github.com/diktamen/nvd-mirror/releases/download/nvd-data-latest/nvd-database.tar.gz
  DC_DATA: ${{ github.workspace }}/dc-data

jobs:
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Telecharger la base NVD pre-construite
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o nvd-database.tar.gz "$NVD_MIRROR_URL"
          curl -fsSL --retry 3 -o nvd-database.tar.gz.sha256 "$NVD_MIRROR_URL.sha256"
          sha256sum -c nvd-database.tar.gz.sha256
          tar -xzf nvd-database.tar.gz -C "$GITHUB_WORKSPACE"
          ls -la "$DC_DATA"

      # Ne rattrape que les CVE publiees depuis la derniere generation du miroir
      - name: Mise a jour incrementale NVD
        continue-on-error: true
        timeout-minutes: 10
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::Secret NVD_API_KEY absent : scan avec la base du miroir (mise a jour quotidienne) sans rattrapage incremental"
            exit 0
          fi
          ./mvnw -B org.owasp:dependency-check-maven:update-only \
            "-DdataDirectory=$DC_DATA" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Dependency-Check
        run: |
          ./mvnw -B org.owasp:dependency-check-maven:aggregate \
            "-DdataDirectory=$DC_DATA" \
            -DautoUpdate=false

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
          if-no-files-found: warn
